<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Routini</title>
  <meta name="description" content="Routini: ontsnap aan oude patronen en bouw routines die blijven. Streak, gewoontes met als-dan-plan, noodmodus, ademhaling en lichttherapie.">
  <meta name="theme-color" content="#07070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Routini">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <main id="app">
    <section id="view" class="view"></section>
  </main>

  <button type="button" id="panicBtn" class="panic-fab" aria-label="Paniekknop">
    <span class="panic-ring"></span>
    <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4z"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
  </button>

  <nav id="tabbar" class="tabbar">
    <button type="button" data-tab="home" class="tab active" aria-label="Home">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg><span>Home</span>
    </button>
    <button type="button" data-tab="tools" class="tab" aria-label="Tools">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Tools</span>
    </button>
    <button type="button" data-tab="progress" class="tab" aria-label="Voortgang">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Voortgang</span>
    </button>
    <button type="button" data-tab="learn" class="tab" aria-label="Leren">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg><span>Leren</span>
    </button>
    <button type="button" data-tab="profile" class="tab" aria-label="Profiel">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profiel</span>
    </button>
    <span class="tab-indicator"></span>
  </nav>

  <div id="sheet-root"></div>
  <div id="fs-root"></div>
  <div id="toast" class="toast"></div>
  <!-- biome-ignore lint/a11y/noLabelWithoutControl: hidden switch that only triggers the iOS haptic -->
  <label id="hapticLabel" aria-hidden="true" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;overflow:hidden"><input type="checkbox" switch id="hapticInput"></label>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/monitor.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/push.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/recap.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/apptrack.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/reflect.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/lessons2.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
