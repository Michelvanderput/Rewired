<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Routini</title>
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#2a1a78"/>
      <stop offset=".55" stop-color="#0e0b24"/>
      <stop offset="1" stop-color="#07070d"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="190" fill="url(#glow)"/>
  <g transform="translate(-6 24)">
  <!-- open shackle: lifted and swung free of the lock -->
  <path d="M196 236V168a60 60 0 0 1 120 0v22" fill="none" stroke="url(#g)" stroke-width="28" stroke-linecap="round" transform="rotate(-22 196 236) translate(0 -26)"/>
  <!-- lock body -->
  <rect x="150" y="236" width="212" height="170" rx="44" fill="none" stroke="url(#g)" stroke-width="28"/>
  <circle cx="256" cy="308" r="20" fill="#22d3ee"/>
  <path d="M256 320v34" stroke="#22d3ee" stroke-width="16" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M376 104l10 28 28 10-28 10-10 28-10-28-28-10 28-10z" fill="#f4f1ff"/>
  <path d="M410 196l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#22d3ee"/>
  </g>
</svg>
